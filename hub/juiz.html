<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação — Torneio de Robótica</title>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    window.API_URL = 'https://script.google.com/macros/s/SEU_SCRIPT_ID/exec';
  </script>
</head>
<body>

<header class="topbar">
  <div class="topbar__logo">🤖 Torneio</div>
  <nav class="topbar__nav">
    <a href="index.html">Hub</a>
    <a href="ranking.html">Ranking</a>
    <a href="juiz.html" class="ativo">Avaliação</a>
    <a href="deliberacao.html">Deliberação</a>
  </nav>
  <div class="topbar__badge">
    <span id="badge-nome" class="text-sm"></span>
    <button class="btn btn-outline btn-sm" id="btn-sessao">Entrar</button>
  </div>
</header>

<div class="container">

  <!-- Login inline -->
  <div id="login-box" class="form-card mt-2 hidden" style="max-width:480px;margin:1.5rem auto">
    <h2>Identificação do Juiz</h2>
    <div class="field mt-2">
      <label>Nome</label>
      <input id="l-nome" type="text" placeholder="Seu nome completo" autocomplete="name">
    </div>
    <div class="field">
      <label>PIN</label>
      <input id="l-pin" type="password" placeholder="PIN fornecido pela organização" autocomplete="current-password">
    </div>
    <button class="btn btn-primary mt-1 w-full" id="btn-login-ok">Entrar</button>
  </div>

  <!-- Seletor de tipo de avaliação -->
  <div id="seletor-tipo" class="form-card mt-2 hidden">
    <h2>Qual avaliação deseja submeter?</h2>
    <div class="grid-2 mt-2">
      <button class="btn btn-outline" onclick="selecionarTipo('Arena')">🤖 Arena</button>
      <button class="btn btn-outline" onclick="selecionarTipo('Projeto de Inovação')">💡 Projeto de Inovação</button>
      <button class="btn btn-outline" onclick="selecionarTipo('Design do Robô')">🔧 Design do Robô</button>
      <button class="btn btn-outline" onclick="selecionarTipo('Core Values')">⭐ Core Values</button>
    </div>
  </div>

  <!-- Formulário de Rubrica (Projeto / Design / Core) -->
  <div id="form-rubrica" class="form-card mt-2 hidden">
    <div class="flex items-center justify-between mb-1">
      <h2 id="rubrica-titulo">Rubrica</h2>
      <button class="btn btn-outline btn-sm" onclick="voltarSeletor()">← Voltar</button>
    </div>

    <div class="field">
      <label>Equipe avaliada</label>
      <select id="r-equipe">
        <option value="">— selecione —</option>
      </select>
    </div>

    <div class="rubrica-grid mt-2" id="criterios-container"></div>

    <div class="flex items-center justify-between mt-3">
      <div class="text-sm" id="r-resumo">Notas selecionadas: 0/10</div>
      <button class="btn btn-success" id="btn-enviar-rubrica" disabled>Enviar avaliação</button>
    </div>
  </div>

  <!-- Formulário da Arena -->
  <div id="form-arena" class="form-card mt-2 hidden">
    <div class="flex items-center justify-between mb-1">
      <h2>🤖 Pontuação da Arena</h2>
      <button class="btn btn-outline btn-sm" onclick="voltarSeletor()">← Voltar</button>
    </div>

    <div class="grid-2">
      <div class="field">
        <label>Equipe</label>
        <select id="a-equipe">
          <option value="">— selecione —</option>
        </select>
      </div>
      <div class="field">
        <label>Round</label>
        <select id="a-round">
          <option value="Round 1">Round 1</option>
          <option value="Round 2">Round 2</option>
          <option value="Round 3">Round 3</option>
          <option value="Round 4">Round 4</option>
        </select>
      </div>
    </div>

    <p class="text-sm mt-1 mb-1" style="margin-bottom:.75rem">
      Digite os pontos de cada missão (0 se não completada).
    </p>
    <div class="missao-grid" id="missoes-container">
      <!-- gerado por JS com missões padrão -->
    </div>

    <div class="field mt-2">
      <label>Penalidade (subtrair do total)</label>
      <input type="number" id="a-penalidade" min="0" max="200" value="0" style="max-width:140px">
    </div>

    <div class="flex items-center justify-between mt-3">
      <div><strong id="a-total">Total: 0 pts</strong></div>
      <button class="btn btn-success" id="btn-enviar-arena">Registrar</button>
    </div>
  </div>

</div>

<div id="toast"></div>
<script src="js/api.js"></script>
<script>
  // ── Config ──────────────────────────────────────────────────────
  const CRITERIOS = {
    'Projeto de Inovação': [
      'Identificação do Problema',
      'Pesquisa e Coleta de Dados',
      'Proposta de Solução',
      'Inovação e Criatividade',
      'Validação da Solução',
      'Considerações de Implementação',
      'Impacto na Comunidade',
      'Comunicação e Apresentação',
      'Compartilhamento com Especialistas',
      'Trabalho em Equipe'
    ],
    'Design do Robô': [
      'Identificação do Problema',
      'Estratégia de Programação',
      'Estratégia Mecânica',
      'Mecanismos de Aquisição',
      'Controle do Robô',
      'Documentação do Código',
      'Autonomia e Precisão',
      'Eficiência do Design',
      'Iteração e Melhoria',
      'Trabalho em Equipe'
    ],
    'Core Values': [
      'Descoberta — aprendemos e crescemos',
      'Inovação — fazemos as coisas de forma nova',
      'Impacto — nos importamos com o mundo',
      'Inclusão — respeitamos as diferenças',
      'Cooperação — somos mais fortes juntos',
      'Diversão — celebramos o aprendizado',
      'Comunicação da Equipe',
      'Elegância com Graciosidade',
      'Inspiração',
      'Presença e Energia'
    ]
  };

  const MISSOES_PADRAO = [
    'M00 Precisão de Lançamento',
    'M01 Equipamento Inovador',
    'M02 Blocos de Código',
    'M03 Gerenciamento de Missão',
    'M04 Saída do Habitat',
    'M05 Veículo de Saída',
    'M06 Transferência de Produto',
    'M07 Coletor de Amostras',
    'M08 Poço de Inspeção',
    'M09 Anel de Controle de Missão',
    'M10 Módulo de Navegação',
    'M11 Comunicações',
    'M12 Pesquisa Aeroespacial',
    'M13 Robô em Movimento',
    'M14 Equipamento de Precisão'
  ];

  let notasSelecionadas = {};
  let categoriaAtual    = '';
  let cfgServidor       = null;

  // ── Sessão ──────────────────────────────────────────────────────
  function atualizarBadge() {
    const badge = document.getElementById('badge-nome');
    const btn   = document.getElementById('btn-sessao');
    if (Sessao.logado()) {
      badge.textContent = '👤 ' + Sessao.juiz;
      btn.textContent   = 'Sair';
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('seletor-tipo').classList.remove('hidden');
    } else {
      badge.textContent = '';
      btn.textContent   = 'Entrar';
      document.getElementById('login-box').classList.remove('hidden');
      document.getElementById('seletor-tipo').classList.add('hidden');
      document.getElementById('form-rubrica').classList.add('hidden');
      document.getElementById('form-arena').classList.add('hidden');
    }
  }

  document.getElementById('btn-sessao').addEventListener('click', () => {
    if (Sessao.logado()) { Sessao.clear(); atualizarBadge(); }
    else document.getElementById('login-box').classList.remove('hidden');
  });

  document.getElementById('btn-login-ok').addEventListener('click', async () => {
    const nome = document.getElementById('l-nome').value.trim();
    const pin  = document.getElementById('l-pin').value.trim();
    if (!nome || !pin) { toast('Preencha nome e PIN.', 'err'); return; }
    Sessao.set(nome, pin);
    atualizarBadge();
    toast('Olá, ' + nome + '!', 'ok');
    await carregarEquipes();
  });

  // ── Equipes ─────────────────────────────────────────────────────
  async function carregarEquipes() {
    try {
      const r = await API.equipes();
      if (!r.ok) return;
      const opts = r.equipes.map(e =>
        `<option value="${e.id}">${e.id} — ${e.turma}</option>`
      ).join('');
      document.getElementById('r-equipe').innerHTML = '<option value="">— selecione —</option>' + opts;
      document.getElementById('a-equipe').innerHTML = '<option value="">— selecione —</option>' + opts;
    } catch (e) {
      console.warn(e);
    }
  }

  // ── Seleção de tipo ─────────────────────────────────────────────
  function selecionarTipo(tipo) {
    categoriaAtual = tipo;
    document.getElementById('seletor-tipo').classList.add('hidden');

    if (tipo === 'Arena') {
      document.getElementById('form-arena').classList.remove('hidden');
      renderMissoes();
    } else {
      document.getElementById('form-rubrica').classList.remove('hidden');
      document.getElementById('rubrica-titulo').textContent = tipo;
      renderCriterios(tipo);
    }
  }

  function voltarSeletor() {
    document.getElementById('form-rubrica').classList.add('hidden');
    document.getElementById('form-arena').classList.add('hidden');
    document.getElementById('seletor-tipo').classList.remove('hidden');
    notasSelecionadas = {};
  }

  // ── Rubrica ─────────────────────────────────────────────────────
  function renderCriterios(categoria) {
    notasSelecionadas = {};
    const lista = CRITERIOS[categoria] || Array.from({ length: 10 }, (_, i) => 'Critério ' + (i + 1));
    const container = document.getElementById('criterios-container');

    container.innerHTML = lista.map((label, i) => `
      <div class="criterio-row">
        <span class="criterio-label">${i + 1}. ${label}</span>
        <div class="nota-btns" data-idx="${i}">
          ${[1,2,3,4].map(n =>
            `<button class="nota-btn" data-n="${n}" onclick="selecionarNota(${i},${n},this)">${n}</button>`
          ).join('')}
        </div>
      </div>`).join('');

    atualizarResumo(lista.length);
  }

  function selecionarNota(idx, nota, btn) {
    const grupo = btn.closest('[data-idx]');
    grupo.querySelectorAll('.nota-btn').forEach(b => b.className = 'nota-btn');
    btn.className = 'nota-btn sel-' + nota;
    notasSelecionadas[idx] = nota;
    const total = document.getElementById('criterios-container').querySelectorAll('.criterio-row').length;
    atualizarResumo(total);
  }

  function atualizarResumo(total) {
    const qtd  = Object.keys(notasSelecionadas).length;
    const soma  = Object.values(notasSelecionadas).reduce((s, v) => s + v, 0);
    document.getElementById('r-resumo').textContent =
      `Notas selecionadas: ${qtd}/${total} · Soma: ${soma}/${total * 4}`;
    document.getElementById('btn-enviar-rubrica').disabled = qtd < total;
  }

  document.getElementById('btn-enviar-rubrica').addEventListener('click', async () => {
    const equipe = document.getElementById('r-equipe').value;
    if (!equipe) { toast('Selecione uma equipe.', 'err'); return; }

    const total = document.getElementById('criterios-container').querySelectorAll('.criterio-row').length;
    const notas = Array.from({ length: total }, (_, i) => notasSelecionadas[i] || 0);

    const btn = document.getElementById('btn-enviar-rubrica');
    btn.disabled = true;
    btn.textContent = 'Enviando…';

    try {
      const r = await API.salvarRubrica(Sessao.juiz, Sessao.pin, categoriaAtual, equipe, notas);
      if (r.ok) {
        toast('Avaliação enviada com sucesso!', 'ok');
        voltarSeletor();
      } else {
        throw new Error(r.erro || 'Erro desconhecido');
      }
    } catch (e) {
      toast('Erro: ' + e.message, 'err', 5000);
      btn.disabled = false;
      btn.textContent = 'Enviar avaliação';
    }
  });

  // ── Arena ────────────────────────────────────────────────────────
  function renderMissoes() {
    const container = document.getElementById('missoes-container');
    container.innerHTML = MISSOES_PADRAO.map((m, i) => `
      <div class="missao-item">
        <label>${m}</label>
        <input type="number" class="missao-input" data-missao="M${String(i).padStart(2,'0')}"
          min="0" max="999" value="0" oninput="recalcTotal()">
      </div>`).join('');

    document.getElementById('a-penalidade').addEventListener('input', recalcTotal);
  }

  function recalcTotal() {
    let soma = 0;
    document.querySelectorAll('.missao-input').forEach(inp => {
      soma += Number(inp.value) || 0;
    });
    const pen = Number(document.getElementById('a-penalidade').value) || 0;
    const total = Math.max(0, soma - pen);
    document.getElementById('a-total').textContent = 'Total: ' + total + ' pts';
  }

  document.getElementById('btn-enviar-arena').addEventListener('click', async () => {
    const equipe = document.getElementById('a-equipe').value;
    const round  = document.getElementById('a-round').value;
    if (!equipe) { toast('Selecione uma equipe.', 'err'); return; }

    const missoes = {};
    document.querySelectorAll('.missao-input').forEach(inp => {
      missoes[inp.dataset.missao] = Number(inp.value) || 0;
    });
    const penalidade = Number(document.getElementById('a-penalidade').value) || 0;

    const btn = document.getElementById('btn-enviar-arena');
    btn.disabled = true;
    btn.textContent = 'Enviando…';

    try {
      const r = await API.salvarArena(Sessao.juiz, Sessao.pin, equipe, round, missoes, penalidade);
      if (r.ok) {
        toast('Resultado da Arena registrado!', 'ok');
        voltarSeletor();
      } else {
        throw new Error(r.erro || 'Erro desconhecido');
      }
    } catch (e) {
      toast('Erro: ' + e.message, 'err', 5000);
      btn.disabled = false;
      btn.textContent = 'Registrar';
    }
  });

  // ── Init ─────────────────────────────────────────────────────────
  atualizarBadge();
  if (Sessao.logado()) carregarEquipes();
</script>
</body>
</html>

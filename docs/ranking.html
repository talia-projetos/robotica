<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking · HUB Circuito</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12355B">
  <link rel="stylesheet" href="css/styles.css?v=23">
  <script>
    window.API_URL = 'https://script.google.com/macros/s/AKfycbySccrFmufdTM9STXXFcMquZnYSv6ullNfJ-OYyJakdKOgcfwCpae5VpV4BFBqy7pGR/exec';
  </script>
  <style>
    .schedule-head-link {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      gap: .38rem;
      padding: .45rem .85rem;
      border: 1px solid #D9E4EE;
      border-radius: 9px;
      background: #fff;
      color: #41556C;
      font-size: .72rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: border-color .15s, color .15s, background .15s;
      white-space: nowrap;
    }
    .schedule-head-link:hover {
      border-color: #BFD1E0;
      color: #2D6EA7;
    }
    .schedule-head-link--ativo {
      background: #EDF5FC;
      border-color: #2F80ED;
      color: #12355B;
    }
    .schedule-head-link--ativo:hover {
      background: #E0EEF9;
      border-color: #2566C0;
      color: #0E2B4A;
    }
    .page-meta {
      color: #6B7A90;
      font-size: .78rem;
      margin: .15rem 0 0;
    }
  
    /* Ranking: tipografia, alternância e leitura tabular */
    .page-ranking .container { max-width:1220px; padding:1.55rem clamp(1rem,2.6vw,2.5rem) 3rem; }
    .page-ranking .workspace-head { align-items:center; gap:1.2rem; margin-bottom:1.25rem!important; }
    .page-ranking .workspace-eyebrow { font-size:.71rem; font-weight:670; color:#72869A; }
    .page-ranking .workspace-head h1 { color:#17283C; font-size:clamp(1.75rem,2.6vw,2.15rem); line-height:1.15; }
    .page-ranking .page-meta { font-size:.8rem; line-height:1.5; margin-top:.42rem; }
    .page-ranking .workspace-head-actions {
      padding:.3rem; gap:.25rem!important; border:1px solid #E2EAF1;
      border-radius:12px; background:#F5F8FB;
    }
    .page-ranking .schedule-head-link {
      min-height:39px; border:1px solid transparent; border-radius:9px;
      padding:.63rem .95rem; color:#687C91; background:transparent;
      font-size:.74rem; font-weight:740;
    }
    .page-ranking .schedule-head-link:hover { background:#FFF; color:#2B5073; }
    .page-ranking .schedule-head-link--ativo {
      background:#FFF; border-color:#DFE8F1; color:#1E405F;
      box-shadow:0 2px 7px rgba(17,42,65,.08);
    }
    .page-ranking .schedule-head-link:focus-visible { outline:3px solid #9BC4E8; outline-offset:2px; }
    .page-ranking .table-wrap {
      border:1px solid #E1E8F0; border-radius:14px;
      background:#FFF; overflow-x:auto;
      box-shadow:0 3px 18px rgba(15,31,51,.035);
    }
    .page-ranking .table-wrap table { width:100%; border-collapse:separate; border-spacing:0; }
    .page-ranking .table-wrap thead th {
      padding:.85rem .9rem; font-size:.68rem; font-weight:790; letter-spacing:.04em;
      background:#F5F8FB; border-bottom:1px solid #E3EAF1; white-space:nowrap;
    }
    .page-ranking .table-wrap tbody td {
      padding:.85rem .9rem; font-size:.76rem; border-bottom:1px solid #EEF2F6;
      vertical-align:middle; font-variant-numeric:tabular-nums;
    }
    .page-ranking .table-wrap tbody tr:hover { background:#FAFCFF; }
    .page-ranking .table-wrap tbody tr:last-child td { border-bottom:0; }
    .page-ranking #view-categorias .card,
    .page-ranking #view-categorias .cat-card {
      border:1px solid #E1E8F0; border-radius:14px;
      box-shadow:0 3px 18px rgba(15,31,51,.035); overflow:hidden;
    }
    @media(max-width:700px) {
      .page-ranking .container { padding:1.05rem .9rem 2.4rem; }
      .page-ranking .workspace-head { align-items:flex-start; flex-direction:column; gap:.8rem; }
      .page-ranking .workspace-head-actions { max-width:100%; }
      .page-ranking .table-wrap thead th { padding:.68rem .62rem; font-size:.65rem; }
      .page-ranking .table-wrap tbody td { padding:.75rem .62rem; font-size:.72rem; }
    }

  </style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="topbar__brand"><img src="logo.svg" alt="HUB Circuito"></a>
  <div class="topbar__event">
    <div class="topbar__event-name">Torneio Interno de Rob&#xF3;tica</div>
    <div class="topbar__event-org">Escola SESI Reitor Miguel Calmon</div>
  </div>
  <div class="topbar__badge">
    <span id="badge-coord" class="text-sm"></span>
    <span id="sync-tag" class="sync-tag" style="display:none"></span>
    <span class="spinner" id="spinner"></span>
    <button class="btn btn-outline btn-sm" id="btn-sair" style="border-color:rgba(255,255,255,.3);color:#fff;display:none" onclick="CoordAuth.clear();location.reload()">Sair</button>
  </div>
</header>

<div class="app-body">

<nav class="app-sidebar">
  <a href="index.html" class="sidebar-brand" aria-label="HUB Circuito">
    <img src="logo-horizontal.svg" alt="HUB Circuito" class="sidebar-brand__img">
  </a>

  <a href="index.html" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg> Início</a>
  <a href="arena.html" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 4.5c0-.8.85-1.3 1.55-.9l11.1 7.1c.9.58.9 1.97 0 2.55l-11.1 7.1c-.7.45-1.55-.05-1.55-.9z" fill="currentColor" stroke="none"/></svg> Arena</a>
  <a href="turma.html" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1"/><path d="M16 5a3 3 0 0 1 0 6m1 3a5 5 0 0 1 4 5v1"/></svg> Minha Turma</a>
  <a href="juizes.html" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 12l2 2 5-5M9 18h6"/></svg> Juízes</a>
  <a href="coordenacao.html" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 16v-4m5 4V8m5 8v-6"/></svg> Coordenação</a>
  <div class="sidebar-sep"></div>
  <a href="ranking.html" class="sidebar-item ativo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M5 17v-5h4v5m3 0V7h4v10m3 0V4h2v13"/></svg> Ranking</a>
  <a href="documentos.html" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6m-6 4h6m-6 4h4"/></svg> Documentos</a>
  <a href="cronograma.html" class="sidebar-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h3m-3 4h3m4-4h3"/></svg> Cronograma</a>
</nav>

<main class="app-main">

<div class="container">
  <div class="workspace-head" style="margin-bottom:1rem">
    <div class="workspace-head__copy">
      <div class="workspace-eyebrow">Torneio Interno de Robótica</div>
      <h1>Ranking</h1>
      <p class="page-meta">Classificação geral e desempenho por categoria.</p>
    </div>
    <div class="workspace-head-actions" style="display:flex;gap:.45rem;align-items:center;flex-wrap:wrap">
      <button class="schedule-head-link" id="btn-geral" onclick="mostrarView('geral')">Geral</button>
      <button class="schedule-head-link" id="btn-cat" onclick="mostrarView('categorias')">Por Categoria</button>
    </div>
  </div>

  <!-- ── Ranking Geral ─────────────────────────────────────── -->
  <div id="view-geral">
    <div class="table-wrap">
      <table id="tabela-geral">
        <thead id="thead-geral"></thead>
        <tbody id="tbody-geral">
          <tr><td colspan="10" style="text-align:center;padding:2rem">
            <span class="spinner"></span>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ── Ranking por Categoria ─────────────────────────────── -->
  <div id="view-categorias" class="hidden">
    <div class="grid-2" id="cat-wrap"></div>
  </div>
</div>

</main>
</div><!-- /app-body -->

<div id="toast"></div>
<script src="js/api.js?v=5"></script>
<script src="js/sidebar-roles.js?v=6"></script>
<script src="js/product-ui.js?v=11"></script>
<script>
  var dadosEquipes = [];

  // ── Configuração por competição ───────────────────────────────────
  var COMP_CONFIG = {
    'FLL': {
      geralCols: [
        { label: 'Arena',     campo: 'arena20' },
        { label: 'Projeto',   campo: 'proj20'  },
        { label: 'Design',    campo: 'des20'   },
        { label: 'Core',      campo: 'core20'  },
        { label: 'Tampinhas', campo: 'tamp20'  }
      ],
      secoes: [
        { id: 'arena',     titulo: 'Arena',               cor: 'var(--azul)',    campo: 'arena20', posField: 'Arena', qtdField: 'arenaRounds', qtdLabel: 'Rounds'   },
        { id: 'projeto',   titulo: 'Projeto de Inovação', cor: 'var(--roxo)',    campo: 'proj20',  posField: 'Proj',  qtdField: 'projJuizes',  qtdLabel: 'Juízes'   },
        { id: 'design',    titulo: 'Design do Robô',      cor: 'var(--laranja)', campo: 'des20',   posField: 'Des',   qtdField: 'desJuizes',   qtdLabel: 'Juízes'   },
        { id: 'core',      titulo: 'Core Values',         cor: 'var(--verde)',   campo: 'core20',  posField: 'Core',  qtdField: 'coreJuizes',  qtdLabel: 'Juízes'   },
        { id: 'tampinhas', titulo: 'Tampinhas',           cor: 'var(--coral)',   campo: 'tamp20',  posField: 'Tamp',  qtdField: 'tampPes',     qtdLabel: 'Pesagens' }
      ]
    },
    'OBR': {
      geralCols: [
        { label: 'Arena',     campo: 'arena20' },
        { label: 'Projeto',   campo: 'proj20'  },
        { label: 'Design',    campo: 'des20'   },
        { label: 'Core',      campo: 'core20'  },
        { label: 'Tampinhas', campo: 'tamp20'  }
      ],
      secoes: [
        { id: 'arena',     titulo: 'Arena de Resgate',    cor: 'var(--verde)',   campo: 'arena20', posField: 'Arena', qtdField: 'arenaRounds', qtdLabel: 'Rounds'   },
        { id: 'projeto',   titulo: 'Projeto de Inovação', cor: 'var(--roxo)',    campo: 'proj20',  posField: 'Proj',  qtdField: 'projJuizes',  qtdLabel: 'Juízes'   },
        { id: 'design',    titulo: 'Design do Robô',      cor: 'var(--laranja)', campo: 'des20',   posField: 'Des',   qtdField: 'desJuizes',   qtdLabel: 'Juízes'   },
        { id: 'core',      titulo: 'Core Values',         cor: 'var(--verde)',   campo: 'core20',  posField: 'Core',  qtdField: 'coreJuizes',  qtdLabel: 'Juízes'   },
        { id: 'tampinhas', titulo: 'Tampinhas',           cor: 'var(--coral)',   campo: 'tamp20',  posField: 'Tamp',  qtdField: 'tampPes',     qtdLabel: 'Pesagens' }
      ]
    },
    'Steam Racing': {
      geralCols: [
        { label: 'Pista',      campo: 'arena20' },
        { label: 'Engenharia', campo: 'des20'   },
        { label: 'Projeto',    campo: 'proj20'  },
        { label: 'Core',       campo: 'core20'  },
        { label: 'Tampinhas',  campo: 'tamp20'  }
      ],
      secoes: [
        { id: 'arena',     titulo: 'Pista Racing',          cor: '#C0392B',      campo: 'arena20', posField: 'Arena', qtdField: 'arenaRounds', qtdLabel: 'Corridas' },
        { id: 'design',    titulo: 'Projeto de Engenharia', cor: '#C84B00',      campo: 'des20',   posField: 'Des',   qtdField: 'desJuizes',   qtdLabel: 'Juízes'   },
        { id: 'projeto',   titulo: 'Projeto de Inovação',   cor: 'var(--roxo)',  campo: 'proj20',  posField: 'Proj',  qtdField: 'projJuizes',  qtdLabel: 'Juízes'   },
        { id: 'core',      titulo: 'Core Values',           cor: 'var(--verde)', campo: 'core20',  posField: 'Core',  qtdField: 'coreJuizes',  qtdLabel: 'Juízes'   },
        { id: 'tampinhas', titulo: 'Tampinhas',             cor: 'var(--coral)', campo: 'tamp20',  posField: 'Tamp',  qtdField: 'tampPes',     qtdLabel: 'Pesagens' }
      ]
    }
  };

  function cfg() {
    return COMP_CONFIG[Comp.val] || COMP_CONFIG['FLL'];
  }

  // ── Constrói thead e tabelas de categoria baseado na competição ──
  function buildUI() {
    var c = cfg();
    var cols = c.geralCols;
    var span = 5 + cols.length;

    document.getElementById('thead-geral').innerHTML =
      '<tr>'
      + '<th style="width:56px">Pos.</th>'
      + '<th>Equipe</th>'
      + '<th>Turno</th>'
      + cols.map(function(col) { return '<th>' + col.label + '</th>'; }).join('')
      + '<th>Total</th>'
      + '<th>Status</th>'
      + '</tr>';

    var loadingTd = document.querySelector('#tbody-geral tr td');
    if (loadingTd) loadingTd.colSpan = span;

    document.getElementById('cat-wrap').innerHTML = c.secoes.map(function(s) {
      return '<div class="table-wrap">'
        + '<table><thead>'
        + '<tr><th colspan="4" style="background:' + s.cor + '">' + s.titulo + '</th></tr>'
        + '<tr><th>Pos.</th><th>Equipe</th><th>Nota</th><th>' + s.qtdLabel + '</th></tr>'
        + '</thead><tbody id="tbody-' + s.id + '"></tbody></table></div>';
    }).join('');
  }

  // ── Helpers ──────────────────────────────────────────────────────
  function mostrarView(v) {
    document.getElementById('view-geral').classList.toggle('hidden', v !== 'geral');
    document.getElementById('view-categorias').classList.toggle('hidden', v !== 'categorias');
    document.getElementById('btn-geral').className = 'schedule-head-link' + (v === 'geral' ? ' schedule-head-link--ativo' : '');
    document.getElementById('btn-cat').className   = 'schedule-head-link' + (v !== 'geral' ? ' schedule-head-link--ativo' : '');
    history.replaceState(null, '', v === 'categorias' ? '#categorias' : '#');
  }

  function posBadge(pos) {
    var cls = pos === 1 ? 'pos-1' : pos === 2 ? 'pos-2' : pos === 3 ? 'pos-3' : 'pos-n';
    return '<span class="pos-badge ' + cls + '">' + (pos || '—') + '</span>';
  }

  function statusPill(s) {
    var cls = s === 'Completo' ? 'completo' : s === 'Pendente' ? 'pendente' : 'sem';
    return '<span class="status-pill status-' + cls + '">' + s + '</span>';
  }

  function fmt(v, dec) {
    return Number(v || 0).toFixed(dec !== undefined ? dec : 2);
  }

  function nomeEquipe(e) {
    return e.nome || e.turma || e.id;
  }

  // ── Renderização ─────────────────────────────────────────────────
  function renderGeral(equipes) {
    var c = cfg();
    var cols = c.geralCols;
    var span = 5 + cols.length;
    var tbody = document.getElementById('tbody-geral');
    if (!equipes.length) {
      tbody.innerHTML = '<tr><td colspan="' + span + '" style="text-align:center;padding:1.5rem;color:var(--texto-sm)">Nenhuma equipe ainda.</td></tr>';
      return;
    }
    var sorted = equipes.slice().sort(function(a, b) { return (Number(b.total)||0) - (Number(a.total)||0); });
    tbody.innerHTML = sorted.map(function(e, i) {
      var pos = Number(e.total) > 0 ? i + 1 : null;
      return '<tr>'
        + '<td>' + posBadge(pos) + '</td>'
        + '<td><strong>' + nomeEquipe(e) + '</strong><br><span class="text-sm">' + e.id + '</span></td>'
        + '<td><span class="text-sm">' + (e.turno || '—') + '</span></td>'
        + cols.map(function(col) { return '<td>' + fmt(e[col.campo]) + '</td>'; }).join('')
        + '<td><strong>' + fmt(e.total) + '</strong></td>'
        + '<td>' + statusPill(e.status) + '</td>'
        + '</tr>';
    }).join('');
  }

  function renderCategoria(tbodyId, equipes, campo, extra) {
    var tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    var com = equipes.filter(function(e) {
      return Number(e[campo] || 0) > 0 || e['pos' + extra.posField];
    });
    if (!com.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:1rem;color:var(--texto-sm)">Sem dados.</td></tr>';
      return;
    }
    var sorted = com.slice().sort(function(a, b) {
      var pa = Number(a['pos' + extra.posField]) || 9999;
      var pb = Number(b['pos' + extra.posField]) || 9999;
      return pa - pb;
    });
    tbody.innerHTML = sorted.map(function(e) {
      return '<tr>'
        + '<td>' + posBadge(e['pos' + extra.posField]) + '</td>'
        + '<td><strong>' + nomeEquipe(e) + '</strong><br><span class="text-sm">' + e.id + '</span></td>'
        + '<td>' + fmt(e[campo]) + '</td>'
        + '<td class="text-sm">' + (e[extra.qtdField] || '—') + '</td>'
        + '</tr>';
    }).join('');
  }

  async function carregar() {
    var stEl = document.getElementById('sync-tag');
    document.getElementById('spinner').style.display = '';
    if (stEl) { stEl.classList.add('sync-tag--syncing'); stEl.style.display = ''; }
    try {
      var r = await API.ranking(Comp.val);
      if (!r.ok) throw new Error(r.erro);
      dadosEquipes = r.equipes || [];

      if (!dadosEquipes.length) {
        var re = await API.equipes();
        if (re && re.ok && re.equipes && re.equipes.length) {
          dadosEquipes = re.equipes.map(function(e) {
            return Object.assign({ arena20:0, proj20:0, des20:0, core20:0, tamp20:0, total:0, status:'Sem dados' }, e);
          });
        }
      }

      renderGeral(dadosEquipes);
      cfg().secoes.forEach(function(s) {
        renderCategoria('tbody-' + s.id, dadosEquipes, s.campo, { posField: s.posField, qtdField: s.qtdField });
      });

      var agora = new Date();
      if (stEl) {
        stEl.textContent = 'Planilha · ' + agora.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
        stEl.classList.remove('sync-tag--syncing');
      }
    } catch(e) {
      toast('Erro ao carregar ranking: ' + e.message, 'err');
    } finally {
      document.getElementById('spinner').style.display = 'none';
      if (stEl) stEl.classList.remove('sync-tag--syncing');
    }
  }

  // ── Init ──────────────────────────────────────────────────────────
  buildUI();
  if (location.hash === '#categorias') mostrarView('categorias');
  else mostrarView('geral');

  if (CoordAuth.logado()) {
    var _bc = document.getElementById('badge-coord');
    if (_bc) _bc.textContent = CoordAuth.nome;
    document.getElementById('btn-sair').style.display = '';
  }
  iniciarPolling(carregar, 10000);
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");</script>
</body>
</html>

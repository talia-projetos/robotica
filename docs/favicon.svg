<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- fundo arredondado azul escuro -->
  <rect width="100" height="100" rx="18" fill="#1A3D5C"/>

  <!-- antena vertical central -->
  <line x1="50" y1="10" x2="50" y2="33" stroke="white" stroke-width="4.5" stroke-linecap="round"/>

  <!-- traço diagonal esquerdo (sobe e vai para esquerda) -->
  <line x1="44" y1="31" x2="25" y2="16" stroke="white" stroke-width="3.8" stroke-linecap="round"/>

  <!-- traço diagonal direito (sobe e vai para direita) -->
  <line x1="56" y1="31" x2="75" y2="16" stroke="white" stroke-width="3.8" stroke-linecap="round"/>

  <!-- U shape -->
  <path d="M17 37 L17 66 Q17 88 50 88 Q83 88 83 66 L83 37"
        fill="none" stroke="white" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>

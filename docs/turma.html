<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Turma — HUB Circuito</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css?v=5">
  <script>
    window.API_URL = 'https://script.google.com/macros/s/AKfycbyYLpncuJ5NwWF9I_TvM6DTxojhDlrp_TWXG0PE6Ides3NwvdNjwPEf4jUiWDxWScc0/exec';
  </script>
  <style>
    /* ── Login ──────────────────────────────────────────────────── */
    .login-wrap {
      max-width: 420px;
      margin: 3rem auto;
    }

    .login-card {
      background: var(--branco);
      border-radius: 16px;
      padding: 2rem 2.25rem;
      box-shadow: 0 2px 12px rgba(15,23,42,.08);
      border: 1px solid var(--cinza);
    }

    .login-card h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--marinho);
      margin-bottom: .25rem;
    }

    .login-card p {
      font-size: .875rem;
      color: var(--texto-sm);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    /* ── Logout bar ─────────────────────────────────────────────── */
    .turma-logout {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }

    #btn-sair {
      background: none;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: .75rem;
      font-weight: 500;
      padding: .3rem .8rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    #btn-sair:hover {
      background: var(--surface-subtle);
      color: var(--text-primary);
    }

    /* ── Banner da equipe ───────────────────────────────────────── */
    .eq-header {
      background: #2C4F72;
      border-radius: 16px;
      padding: 1.5rem 1.75rem;
      color: #fff;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .eq-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,.25);
      flex-shrink: 0;
    }

    .eq-header__info {
      flex: 1;
      min-width: 0;
    }

    .eq-header__id {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -.3px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .eq-header__nome {
      font-size: .8rem;
      font-weight: 500;
      opacity: .5;
      margin-top: .2rem;
      letter-spacing: .04em;
    }

    .eq-header__status {
      margin-left: auto;
      flex-shrink: 0;
    }

    /* ── Status pill ────────────────────────────────────────────── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-size: .72rem;
      font-weight: 600;
      padding: .3rem .8rem;
      border-radius: 6px;
      letter-spacing: .03em;
      white-space: nowrap;
    }

    .status-pendente {
      background: rgba(254,249,195,.7);
      color: #854D0E;
      border: 1px solid rgba(202,138,4,.2);
    }

    .status-completo {
      background: rgba(240,253,244,.9);
      color: #166534;
      border: 1px solid rgba(34,197,94,.2);
    }

    .status-sem {
      background: rgba(248,250,252,.9);
      color: #64748B;
      border: 1px solid #E2E8F0;
    }

    /* ── Indicadores de ranking ─────────────────────────────────── */
    #ranking-row {
      margin-bottom: 1.5rem;
    }

    #ranking-badges {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: #F4F7FA;
      border: none;
      border-radius: 6px;
      padding: .28rem .65rem .28rem .55rem;
    }

    .rank-badge__pos {
      font-size: 1rem;
      font-weight: 700;
      color: #0F172A;
      line-height: 1;
    }

    .rank-badge__label {
      font-size: .7rem;
      color: #64748B;
      font-weight: 500;
    }

    .rank-badge--geral {
      background: #0F172A;
      padding: .35rem .8rem;
    }

    .rank-badge--geral .rank-badge__pos {
      font-size: 1.1rem;
      color: #F2C94C;
    }

    .rank-badge--geral .rank-badge__label {
      color: rgba(255,255,255,.6);
    }

    /* ── Score cards ────────────────────────────────────────────── */
    .scores-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .scores-cats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 1rem;
    }

    .score-card {
      background: var(--branco);
      border-radius: 14px;
      border: 1px solid var(--cinza);
      padding: 1rem 1.25rem;
      box-shadow: 0 1px 4px rgba(15,23,42,.04);
      display: flex;
      flex-direction: column;
      transition: box-shadow .2s;
    }

    .score-card__label {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--texto-sm);
      margin-bottom: .5rem;
    }

    .score-card__val {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--marinho);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .score-card__max {
      font-size: .72rem;
      color: var(--texto-sm);
      margin-top: .2rem;
    }

    .score-card__waiting {
      color: var(--texto-sm);
      font-style: italic;
      opacity: .75;
    }

    .score-card__val--pending {
      color: var(--texto-sm);
      font-size: 1.35rem;
    }

    .score-card__bar {
      height: 5px;
      border-radius: 3px;
      background: var(--cinza);
      margin-top: auto;
      padding-top: .75rem;
      overflow: visible;
    }

    .score-card__bar-track {
      height: 5px;
      background: var(--cinza);
      border-radius: 3px;
      overflow: hidden;
    }

    .score-card__bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width .6s ease;
    }

    /* Card total */
    .score-card.total-card {
      border-color: rgba(183,121,31,.22);
      padding: 1.25rem 1.75rem;
      background: linear-gradient(135deg, #FFFDF5 0%, #fff 60%);
    }

    .score-card.total-card .score-card__label {
      margin-bottom: .35rem;
    }

    .total-main {
      display: flex;
      align-items: baseline;
      gap: .75rem;
      margin-bottom: .625rem;
    }

    .score-card.total-card .score-card__val {
      font-size: 2.25rem;
      color: #B7791F;
    }

    .score-card.total-card .score-card__max {
      margin-top: 0;
      font-size: .8rem;
    }

    .score-card.total-card .score-card__bar-track {
      height: 7px;
      border-radius: 4px;
    }

    .score-card.total-card .score-card__bar-fill {
      height: 7px;
      border-radius: 4px;
    }

    /* ── Comentários dos Juízes ─────────────────────────────────── */
    .comments-section {
      margin-top: 2.5rem;
    }

    .comments-section h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--marinho);
      margin-bottom: 1.25rem;
      letter-spacing: -.2px;
    }

    .cat-accordion {
      border: 1px solid var(--cinza);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: .625rem;
      transition: box-shadow .15s;
    }

    .cat-accordion:hover {
      box-shadow: 0 2px 8px rgba(15,23,42,.06);
    }

    .cat-accordion__header {
      display: flex;
      align-items: center;
      padding: .875rem 1.25rem;
      background: var(--fundo);
      cursor: pointer;
      font-weight: 600;
      font-size: .875rem;
      color: var(--marinho);
      user-select: none;
      border: none;
      width: 100%;
      text-align: left;
      gap: 0;
      transition: background .15s;
    }

    .cat-accordion__header:hover { background: #EEF2F7; }

    .cat-accordion__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-right: .6rem;
    }

    .cat-accordion__count {
      font-size: .72rem;
      font-weight: 500;
      color: var(--texto-sm);
      margin-left: auto;
      margin-right: .75rem;
    }

    .cat-accordion__arrow {
      color: var(--texto-sm);
      display: flex;
      align-items: center;
      transition: transform .2s ease;
      flex-shrink: 0;
    }

    .cat-accordion.open .cat-accordion__arrow { transform: rotate(180deg); }

    .cat-accordion__body {
      display: none;
      padding: 1.25rem 1.25rem;
      background: var(--branco);
      border-top: 1px solid var(--cinza);
    }

    .cat-accordion.open .cat-accordion__body { display: block; }

    /* ── Itens de comentário ────────────────────────────────────── */
    .comment-item {
      padding: .875rem 0;
      border-bottom: 1px solid var(--cinza);
    }

    .comment-item:last-child { border-bottom: none; }

    .comment-item__juiz {
      font-size: .68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--texto-sm);
      margin-bottom: .6rem;
    }

    .comment-bom {
      background: #F6FDF8;
      border-left: 2px solid var(--verde);
      border-radius: 0 8px 8px 0;
      padding: .625rem 1rem;
      margin-bottom: .5rem;
    }

    .comment-ref {
      background: #FFFBF5;
      border-left: 2px solid var(--laranja);
      border-radius: 0 8px 8px 0;
      padding: .625rem 1rem;
    }

    .comment-tag {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: .25rem;
    }

    .comment-tag.bom { color: var(--verde); }
    .comment-tag.ref { color: var(--laranja); }

    .comment-text {
      font-size: .875rem;
      color: var(--texto);
      line-height: 1.6;
    }

    .no-comments {
      color: var(--texto-sm);
      font-size: .875rem;
      text-align: center;
      padding: 1.25rem 0;
    }

    /* ── Responsividade local ───────────────────────────────────── */
    @media (max-width: 640px) {
      .eq-header { padding: 1.25rem; gap: 1rem; }
      .eq-header__id { font-size: 1.2rem; }
      .eq-logo { width: 52px; height: 52px; }
      .scores-cats-grid { grid-template-columns: repeat(2, 1fr); }
      #ranking-badges { gap: .375rem; }
    }

    @media (max-width: 420px) {
      .scores-cats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

<script>
  const STORAGE_KEY_ID  = 'turma_id';
  const STORAGE_KEY_PIN = 'turma_pin';

  const CAT_COLORS = {
    'Projeto de Inovação': { color: '#8E5BD9' },
    'Design do Robô':      { color: '#F2994A' },
    'Core Values':         { color: '#27AE60' }
  };

  const SCORE_CARDS = [
    {
      label: 'Arena', campo: 'arena20', max: 20, color: '#2F80ED',
      sub: function(e) {
        var n = parseInt(e.arenaRounds) || 0;
        return n > 0 ? n + (n === 1 ? ' round' : ' rounds') : null;
      }
    },
    {
      label: 'Projeto de Inovação', campo: 'proj20', max: 20, color: '#8E5BD9',
      sub: function(e) {
        var n = parseInt(e.projJuizes) || 0;
        return n > 0 ? n + (n === 1 ? ' juiz' : ' juízes') : null;
      }
    },
    {
      label: 'Design do Robô', campo: 'des20', max: 20, color: '#F2994A',
      sub: function(e) {
        var n = parseInt(e.desJuizes) || 0;
        return n > 0 ? n + (n === 1 ? ' juiz' : ' juízes') : null;
      }
    },
    {
      label: 'Core Values', campo: 'core20', max: 20, color: '#27AE60',
      sub: function(e) {
        var n = parseInt(e.coreJuizes) || 0;
        return n > 0 ? n + (n === 1 ? ' juiz' : ' juízes') : null;
      }
    },
    {
      label: 'Tampinhas', campo: 'tamp20', max: 20, color: '#0D9488',
      sub: function(e) {
        var kg = parseFloat(e.tampKg) || 0;
        return kg > 0 ? kg.toFixed(2) + ' kg' : null;
      }
    }
  ];

  var CHEVRON_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

  function fmt(v) { return Number(v || 0).toFixed(2); }

  function statusPill(s) {
    var cls = s === 'Completo' ? 'completo' : s === 'Pendente' ? 'pendente' : 'sem';
    return '<span class="status-pill status-' + cls + '">' + (s || 'Sem dados') + '</span>';
  }

  function renderScores(scores) {
    if (!scores) {
      document.getElementById('scores-grid').innerHTML =
        '<p class="text-sm" style="color:var(--texto-sm)">Resultados ainda não disponíveis.</p>';
      return;
    }

    var total    = Number(scores.total || 0);
    var totalPct = Math.min(100, (total / 100) * 100);

    var totalCard = '<div class="score-card total-card">'
      + '<div class="score-card__label">Total Geral</div>'
      + '<div class="total-main">'
      + '<span class="score-card__val">' + fmt(total) + '</span>'
      + '<span class="score-card__max">de 100 pts</span>'
      + '</div>'
      + '<div class="score-card__bar-track"><div class="score-card__bar-fill" style="width:' + totalPct + '%;background:var(--brand-ouro)"></div></div>'
      + '</div>';

    var cats = SCORE_CARDS.map(function(c) {
      var val  = Number(scores[c.campo] || 0);
      var pct  = Math.min(100, (val / c.max) * 100);
      var sub  = c.sub(scores);
      var semAvaliacao = !sub;
      var maxLine = sub
        ? '<div class="score-card__max">de ' + c.max + ' pts &middot; ' + sub + '</div>'
        : '<div class="score-card__max score-card__waiting">Aguardando avaliação</div>';
      return '<div class="score-card" style="border-top:2px solid ' + c.color + '">'
        + '<div class="score-card__label">' + c.label + '</div>'
        + '<div class="score-card__val' + (semAvaliacao ? ' score-card__val--pending' : '') + '">' + fmt(val) + '</div>'
        + maxLine
        + '<div class="score-card__bar-track" style="margin-top:.625rem"><div class="score-card__bar-fill" style="width:' + pct + '%;background:' + c.color + '"></div></div>'
        + '</div>';
    });

    document.getElementById('scores-grid').innerHTML =
      totalCard + '<div class="scores-cats-grid">' + cats.join('') + '</div>';
  }

  function renderComments(comentarios) {
    var cats = [
      { key: 'Projeto de Inovação', label: 'Projeto de Inovação' },
      { key: 'Design do Robô',      label: 'Design do Robô' },
      { key: 'Core Values',         label: 'Core Values' }
    ];

    var html = cats.map(function(cat) {
      var lista = (comentarios && comentarios[cat.key]) || [];
      var c     = CAT_COLORS[cat.key] || { color: '#2F80ED' };
      var count = lista.length;
      var countText = count === 0
        ? 'Nenhum comentário'
        : count + ' comentário' + (count !== 1 ? 's' : '');

      var items = count === 0
        ? '<p class="no-comments">Nenhum comentário recebido ainda.</p>'
        : lista.map(function(item) {
            var partes = [];
            if (item.bomTrabalho) partes.push(
              '<div class="comment-bom">'
              + '<div class="comment-tag bom">Bom trabalho!</div>'
              + '<div class="comment-text">' + item.bomTrabalho + '</div>'
              + '</div>');
            if (item.reflitam) partes.push(
              '<div class="comment-ref">'
              + '<div class="comment-tag ref">Reflitam sobre...</div>'
              + '<div class="comment-text">' + item.reflitam + '</div>'
              + '</div>');
            var juizLine = item.juiz
              ? '<div class="comment-item__juiz">Juiz: ' + item.juiz + '</div>'
              : '';
            return '<div class="comment-item">' + juizLine + partes.join('') + '</div>';
          }).join('');

      return '<div class="cat-accordion" id="acc-' + cat.key.replace(/\s/g, '_') + '">'
        + '<button class="cat-accordion__header" onclick="toggleAcc(this)">'
        + '<span class="cat-accordion__dot" style="background:' + c.color + '"></span>'
        + cat.label
        + '<span class="cat-accordion__count">' + countText + '</span>'
        + '<span class="cat-accordion__arrow">' + CHEVRON_SVG + '</span>'
        + '</button>'
        + '<div class="cat-accordion__body">' + items + '</div>'
        + '</div>';
    }).join('');

    document.getElementById('accordions').innerHTML = html;
  }

  function toggleAcc(btn) {
    btn.closest('.cat-accordion').classList.toggle('open');
  }

  function mostrarResultados(data) {
    document.getElementById('view-login').classList.add('hidden');
    document.getElementById('view-resultados').classList.remove('hidden');

    var eq = data.equipe || {};
    var raw        = nomesMap[eq.id] || eq.nome || eq.id;
    var partes     = raw.split(' - ');
    var nomeExibido = partes.length > 1 ? partes[1].trim() : raw;
    var turmaSigla  = partes.length > 1 ? partes[0].trim() : '';

    var metaPartes = [];
    if (turmaSigla) metaPartes.push(turmaSigla);
    if (eq.turno)   metaPartes.push(eq.turno);
    if (eq.id)      metaPartes.push(eq.id);

    document.getElementById('eq-id').textContent   = nomeExibido;
    document.getElementById('eq-nome').textContent = metaPartes.join(' · ');
    document.getElementById('eq-status').innerHTML = data.scores ? statusPill(data.scores.status) : '';
    document.getElementById('badge-turma').textContent = eq.id || '';
    document.getElementById('logout-info').textContent = '';

    // Busca posição no ranking
    document.getElementById('ranking-row').style.display = 'none';
    API.ranking().then(function(r) {
      if (!r.ok || !r.equipes || !r.equipes.length) return;
      var all = r.equipes;
      var posGeral = all.findIndex(function(e) { return e.id === eq.id; }) + 1;
      if (!posGeral) return;

      var cats = [
        { campo: 'arena20', label: 'Arena',   cor: '#2F80ED' },
        { campo: 'proj20',  label: 'Projeto',  cor: '#8E5BD9' },
        { campo: 'des20',   label: 'Design',   cor: '#F2994A' },
        { campo: 'core20',  label: 'Core',     cor: '#27AE60' }
      ];

      var catBadges = cats.map(function(cat) {
        var sorted = all.slice().sort(function(a, b) {
          return (b[cat.campo] || 0) - (a[cat.campo] || 0);
        });
        var pos = sorted.findIndex(function(e) { return e.id === eq.id; }) + 1;
        return '<span class="rank-badge" style="border-left:3px solid ' + cat.cor + '">'
          + '<strong class="rank-badge__pos">' + pos + 'º</strong>'
          + '<span class="rank-badge__label">' + cat.label + '</span>'
          + '</span>';
      }).join('');

      document.getElementById('ranking-badges').innerHTML =
        '<span class="rank-badge rank-badge--geral">'
        + '<strong class="rank-badge__pos">' + posGeral + 'º</strong>'
        + '<span class="rank-badge__label">Geral &middot; ' + all.length + ' eq.</span>'
        + '</span>' + catBadges;

      document.getElementById('ranking-row').style.display = '';
    }).catch(function() {});

    var logoFiles = {
      TUR01:'TUR01.jpg', TUR02:'TUR02.png', TUR03:'TUR03.png',
      TUR04:'TUR04.jpg', TUR05:'TUR05.png',
      TUR06:'TUR06.jpg', TUR07:'TUR07.jpg', TUR08:'TUR08.jpg',
      TUR09:'TUR09.jpg', TUR10:'TUR10.jpg', TUR11:'TUR11.jpg',
      TUR12:'TUR12.jpg', TUR13:'TUR13.jpg'
    };

    var logoEl   = document.getElementById('eq-logo');
    var logoFile = logoFiles[eq.id];
    if (logoFile) {
      logoEl.src = 'img/turmas/' + logoFile;
      logoEl.style.display = '';
    } else {
      logoEl.style.display = 'none';
    }

    renderScores(data.scores);
    renderComments(data.comentarios);

    // Auto-abre accordion com comentários
    document.querySelectorAll('.cat-accordion').forEach(function(el) {
      var count = parseInt(el.querySelector('.cat-accordion__count').textContent) || 0;
      if (count > 0) el.classList.add('open');
    });
  }

  function sair() {
    localStorage.removeItem(STORAGE_KEY_ID);
    localStorage.removeItem(STORAGE_KEY_PIN);
    document.getElementById('view-resultados').classList.add('hidden');
    document.getElementById('view-login').classList.remove('hidden');
    document.getElementById('badge-turma').textContent = '';
    document.getElementById('l-pin').value = '';
  }

  document.getElementById('btn-sair').addEventListener('click', sair);

  document.getElementById('l-pin').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('btn-acessar').click();
  });

  document.getElementById('btn-acessar').addEventListener('click', async function() {
    var id    = document.getElementById('l-equipe').value.trim().toUpperCase();
    var pin   = document.getElementById('l-pin').value.trim();
    var erroEl = document.getElementById('login-erro');
    erroEl.style.display = 'none';

    if (!id) { erroEl.textContent = 'Selecione a equipe.'; erroEl.style.display = ''; return; }

    document.getElementById('spinner').style.display = '';
    this.disabled = true;
    try {
      var r = await API.turma(id, pin);
      if (!r.ok) {
        erroEl.textContent = r.erro || 'Erro ao autenticar.';
        erroEl.style.display = '';
      } else {
        localStorage.setItem(STORAGE_KEY_ID, id);
        localStorage.setItem(STORAGE_KEY_PIN, pin);
        mostrarResultados(r);
      }
    } catch (e) {
      erroEl.textContent = 'Erro de conexão: ' + e.message;
      erroEl.style.display = '';
    } finally {
      document.getElementById('spinner').style.display = 'none';
      this.disabled = false;
    }
  });

  var nomesMap = {
    TUR01:'6° A - Cyber Panter', TUR02:'6° B - Liga do Choque',
    TUR03:'6° C - Alpha Tech',   TUR04:'6° D - Pheonics Mecanics',
    TUR05:'6° E - TecShark',     TUR06:'7° A - Hoppin Robots',
    TUR07:'7° B - Bivoltx',      TUR08:'7° C - Ecoshift',
    TUR09:'7° D - Pantera Lego Team', TUR10:'7° E - Império das Onças',
    TUR11:'7° F - Poseidon',     TUR12:'7° G - Arara Azul',
    TUR13:'7° H - Nexos'
  };

  async function carregarEquipes() {
    try {
      var r = await API.equipes();
      var sel = document.getElementById('l-equipe');
      if (r.ok && r.equipes && r.equipes.length) {
        sel.innerHTML = '<option value="">— selecione —</option>' +
          r.equipes.map(function(e) {
            var rawN  = nomesMap[e.id] || e.nome || e.id;
            var psN   = rawN.split(' - ');
            var nome  = psN.length > 1 ? psN[1].trim() : rawN;
            var tSig  = psN.length > 1 ? psN[0].trim() : '';
            var label = (tSig ? tSig + ' · ' : '') + nome + (e.tutor ? ' (' + e.tutor + ')' : '');
            return '<option value="' + e.id + '">' + label + '</option>';
          }).join('');
      } else {
        sel.innerHTML = '<option value="">— nenhuma equipe cadastrada —</option>';
      }
    } catch(_) {
      document.getElementById('l-equipe').innerHTML = '<option value="">— erro ao carregar —</option>';
    }
  }

  async function tentarResumir() {
    var id  = localStorage.getItem(STORAGE_KEY_ID);
    var pin = localStorage.getItem(STORAGE_KEY_PIN);
    if (!id) return;
    document.getElementById('view-login').classList.add('hidden'); // sessão já existe
    document.getElementById('spinner').style.display = '';
    try {
      var r = await API.turma(id, pin || '');
      if (r.ok) mostrarResultados(r);
      else document.getElementById('view-login').classList.remove('hidden'); // credencial inválida
    } catch(_) {
      document.getElementById('view-login').classList.remove('hidden'); // erro de rede
    }
    finally { document.getElementById('spinner').style.display = 'none'; }
  }

  carregarEquipes();
  tentarResumir();
</script>
</body>
</html>

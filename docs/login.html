<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — HUB Circuito</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      background: #F1F5F9;
    }

    /* ── Painel esquerdo ─────────────────────────────────────── */
    .login-left {
      width: 42%;
      background: linear-gradient(155deg, #162B40 0%, #1C3555 55%, #1F3C62 100%);
      display: flex;
      flex-direction: column;
      padding: 3.25rem 3.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Centraliza brand + quote verticalmente */
    .left-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2.5rem;
    }

    /* Dot grid discreto */
    .login-left::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* Glow sutil no canto inferior */
    .login-left::after {
      content: '';
      position: absolute;
      bottom: -100px;
      right: -60px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(80,143,203,.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .left-brand {
      position: relative;
      z-index: 1;
    }
    .left-brand img {
      height: 130px;
      width: auto;
      display: block;
      margin-bottom: 1rem;
    }
    .left-descriptor {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(255,255,255,.38);
    }

    .left-quote {
      position: relative;
      z-index: 1;
    }
    .left-quote__main {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.38;
      color: rgba(255,255,255,.88);
    }

    .left-footer {
      position: relative;
      z-index: 1;
      font-size: .65rem;
      color: rgba(255,255,255,.36);
      letter-spacing: .04em;
    }

    /* ── Painel direito ──────────────────────────────────────── */
    .login-right {
      flex: 1;
      background: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2.5rem;
    }

    .login-form {
      width: 100%;
      max-width: 360px;
    }

    /* ── Cabeçalho do formulário ─────────────────────────────── */
    .form-eyebrow {
      font-size: .73rem;
      font-weight: 600;
      color: #508FCB;
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: .3rem;
    }
    .form-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: #0F1F33;
      letter-spacing: -.04em;
      margin-bottom: .2rem;
    }
    .form-sub {
      font-size: .875rem;
      color: #64748B;
      margin-bottom: 2.25rem;
    }

    /* ── Campos ──────────────────────────────────────────────── */
    .field { margin-bottom: 1.1rem; }
    .field label {
      display: block;
      font-size: .82rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: .4rem;
    }
    .field input {
      width: 100%;
      padding: .65rem .85rem;
      border: 1px solid #D1D9E6;
      border-radius: 8px;
      font-family: inherit;
      font-size: .9rem;
      color: #0F1F33;
      background: #fff;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus {
      border-color: #508FCB;
      box-shadow: 0 0 0 3px rgba(80,143,203,.13);
    }
    .field input::placeholder { color: #A8B5C5; }

    /* PIN: wrapper com botão olho */
    .pin-wrapper {
      position: relative;
    }
    .pin-wrapper input {
      padding-right: 2.6rem;
    }
    .pin-toggle {
      position: absolute;
      right: .7rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: .25rem;
      color: #9CA3AF;
      line-height: 0;
      border-radius: 4px;
      transition: color .15s;
    }
    .pin-toggle:hover { color: #508FCB; }
    .pin-toggle:focus-visible {
      outline: 2px solid #508FCB;
      outline-offset: 2px;
    }

    /* Texto auxiliar */
    .field-hint {
      font-size: .76rem;
      color: #7A8FA6;
      margin-top: .4rem;
      line-height: 1.45;
    }

    /* ── Erro ────────────────────────────────────────────────── */
    .login-erro {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 8px;
      padding: .55rem .8rem;
      font-size: .82rem;
      color: #DC2626;
      margin-bottom: 1rem;
      display: none;
    }

    /* ── Botão principal ─────────────────────────────────────── */
    .btn-login {
      width: 100%;
      padding: .72rem;
      background: #508FCB;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: .92rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      margin-bottom: 1.75rem;
    }
    .btn-login:hover:not(:disabled) { background: #3d7db8; }
    .btn-login:focus-visible {
      outline: 2px solid #508FCB;
      outline-offset: 3px;
    }
    .btn-login:disabled { opacity: .58; cursor: default; }

    .spinner-sm {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    .btn-login.loading .spinner-sm { display: block; }
    .btn-login.loading .btn-text  { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Placeholder Google (estrutura futura) ───────────────── */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1.25rem;
      color: #C8D4E0;
      font-size: .75rem;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E2E8F0;
    }

    /* botão Google oculto por ora — deixa espaço preparado */
    .btn-google { display: none; }

    /* ── Responsivo ──────────────────────────────────────────── */
    @media (max-width: 680px) {
      body { flex-direction: column; }
      .login-left {
        width: 100%;
        padding: 2rem 2rem 1.75rem;
        min-height: auto;
      }
      .left-content { gap: 1.5rem; flex: none; }
      .left-footer { margin-top: 1.5rem; }
      .login-right { padding: 2rem 1.5rem; }
    }
  </style>
  <script>
    window.API_URL = 'https://script.google.com/macros/s/AKfycbyYLpncuJ5NwWF9I_TvM6DTxojhDlrp_TWXG0PE6Ides3NwvdNjwPEf4jUiWDxWScc0/exec';
  </script>
</head>
<body>

<!-- ── Painel esquerdo ───────────────────────────────────────── -->
<div class="login-left">
  <div class="left-content">
    <div class="left-brand">
      <img src="logo.svg" alt="HUB Circuito">
      <div class="left-descriptor">Plataforma de Rob&oacute;tica Educacional</div>
    </div>

    <div class="left-quote">
      <div class="left-quote__main">Mais que competi&ccedil;&otilde;es.<br>Experi&ecirc;ncias que<br>transformam.</div>
    </div>
  </div>

  <div class="left-footer">HUB Circuito &middot; Escola SESI Reitor Miguel Calmon</div>
</div>

<!-- ── Painel direito ────────────────────────────────────────── -->
<div class="login-right">
  <div class="login-form">
    <div class="form-eyebrow">Bem-vindo ao</div>
    <div class="form-title">HUB Circuito</div>
    <div class="form-sub">Acesse seu ambiente</div>

    <div class="field">
      <label for="f-id">Identifica&ccedil;&atilde;o</label>
      <input id="f-id" type="text"
             placeholder="Nome ou ID da turma"
             autocomplete="username" autofocus>
      <p class="field-hint">Ju&iacute;zes e coordena&ccedil;&atilde;o usam o nome. Professores usam o ID da turma, como TUR01.</p>
    </div>

    <div class="field">
      <label for="f-pin">PIN de acesso</label>
      <div class="pin-wrapper">
        <input id="f-pin" type="password"
               placeholder="PIN"
               autocomplete="current-password">
        <button class="pin-toggle" id="pin-toggle" type="button" aria-label="Mostrar PIN">
          <!-- olho fechado (padrão: campo oculto) -->
          <svg id="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
          <!-- olho aberto (quando PIN visível) -->
          <svg id="icon-eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
               style="display:none">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="login-erro" id="login-erro"></div>

    <button class="btn-login" id="btn-entrar" type="button">
      <div class="spinner-sm"></div>
      <span class="btn-text">Entrar</span>
    </button>

    <!-- Estrutura preparada para Google auth (oculta por ora) -->
    <div class="auth-divider">ou</div>
    <button class="btn-google" type="button" disabled>Continuar com Google</button>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  /* Redireciona se já estiver logado */
  (function () {
    if (localStorage.getItem('coord_nome') && localStorage.getItem('coord_pin')) { location.replace('index.html'); return; }
    if (localStorage.getItem('hub_juiz')   && localStorage.getItem('hub_pin'))   { location.replace('juizes.html'); return; }
    if (localStorage.getItem('turma_id')   && localStorage.getItem('turma_pin')) { location.replace('turma.html'); return; }
  })();

  /* Toggle PIN visível/oculto */
  var pinInput  = document.getElementById('f-pin');
  var pinToggle = document.getElementById('pin-toggle');
  var eyeOff    = document.getElementById('icon-eye-off');
  var eyeOn     = document.getElementById('icon-eye-on');

  pinToggle.addEventListener('click', function () {
    var isHidden = pinInput.type === 'password';
    pinInput.type = isHidden ? 'text' : 'password';
    eyeOff.style.display = isHidden ? 'none' : '';
    eyeOn.style.display  = isHidden ? '' : 'none';
    pinToggle.setAttribute('aria-label', isHidden ? 'Ocultar PIN' : 'Mostrar PIN');
  });

  /* Login */
  var btn  = document.getElementById('btn-entrar');
  var erro = document.getElementById('login-erro');

  function setLoading(on) {
    btn.disabled = on;
    btn.classList.toggle('loading', on);
  }
  function showErro(msg) {
    erro.textContent = msg;
    erro.style.display = '';
  }
  function hideErro() { erro.style.display = 'none'; }

  async function tentarLogin() {
    var id  = document.getElementById('f-id').value.trim();
    var pin = document.getElementById('f-pin').value.trim();
    hideErro();

    if (!id || !pin) { showErro('Preencha identificação e PIN.'); return; }

    setLoading(true);
    try {
      /* Juiz / coordenação */
      try {
        var r = await API.verificarJuiz(id, pin);
        if (r.ok) {
          if (r.coordenador) {
            CoordAuth.set(id, pin);
            location.replace('index.html');
          } else {
            Sessao.set(id, pin);
            location.replace('juizes.html');
          }
          return;
        }
      } catch (_) {}

      /* Turma / professores */
      try {
        var t = await API.turma(id.toUpperCase(), pin);
        if (t.ok) {
          localStorage.setItem('turma_id',  id.toUpperCase());
          localStorage.setItem('turma_pin', pin);
          location.replace('turma.html');
          return;
        }
      } catch (_) {}

      showErro('Identificação ou PIN incorretos.');
    } finally {
      setLoading(false);
    }
  }

  btn.addEventListener('click', tentarLogin);
  document.getElementById('f-pin').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tentarLogin();
  });
  document.getElementById('f-id').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('f-pin').focus();
  });
</script>
</body>
</html>

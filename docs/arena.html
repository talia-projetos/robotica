<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena — HUB Circuito</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css?v=4">
  <script>
    window.API_URL = 'https://script.google.com/macros/s/AKfycbyYLpncuJ5NwWF9I_TvM6DTxojhDlrp_TWXG0PE6Ides3NwvdNjwPEf4jUiWDxWScc0/exec';
  </script>
  <style>
    /* ── Variáveis locais da Arena ─────────────────────────────── */
    :root {
      --ar-bg:      #0A1628;
      --ar-bg2:     #0D1F38;
      --ar-surface: #0F2444;
      --ar-border:  #1E3A5F;
      --ar-text:    #E8F0FE;
      --ar-muted:   rgba(232,240,254,.45);
      --ar-gold:    #F2C94C;
      --ar-gold-bg: rgba(242,201,76,.14);
      --ar-head:    #12355B;
    }

    body {
      background: var(--ar-bg);
      color: var(--ar-text);
    }

    body.claro {
      --ar-bg:      #F3F6FA;
      --ar-bg2:     #FFFFFF;
      --ar-surface: #FFFFFF;
      --ar-border:  #D9E2EC;
      --ar-text:    #243447;
      --ar-muted:   #6B7A90;
      --ar-gold:    #B7791F;
      --ar-gold-bg: #FFF9E6;
      --ar-head:    #12355B;
    }

    body.claro .topbar { background: var(--marinho); }

    /* ── Container: largura expandida — local a esta página ─────── */
    .container { max-width: 1280px; }

    /* ── Cabeçalho da página ────────────────────────────────────── */
    .arena-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0 1.25rem;
      flex-wrap: wrap;
    }

    .arena-titulo {
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--ar-text);
      letter-spacing: -.4px;
      line-height: 1.2;
    }

    /* ── Controles utilitários (Grande / Claro / Tela cheia) ─────── */
    .arena-controles {
      margin-left: auto;
      display: flex;
      gap: .2rem;
      align-items: center;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--ar-border);
      border-radius: 10px;
      padding: .3rem .4rem;
    }

    body.claro .arena-controles {
      background: rgba(0,0,0,.03);
    }

    .arena-controles .btn-outline {
      border: none;
      background: transparent;
      color: var(--ar-muted);
      font-size: .78rem;
      font-weight: 600;
      padding: .3rem .65rem;
      border-radius: 7px;
      transition: background .15s, color .15s;
    }

    .arena-controles .btn-outline:hover {
      background: rgba(255,255,255,.09);
      color: var(--ar-text);
      border: none;
    }

    body.claro .arena-controles .btn-outline:hover {
      background: rgba(0,0,0,.07);
    }

    /* ── Indicador de sincronização ─────────────────────────────── */
    .arena-update {
      font-size: .78rem;
      color: var(--ar-muted);
      display: inline-flex;
      align-items: center;
      gap: .35rem;
    }

    .arena-update:not(:empty)::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #50CCC6;
      flex-shrink: 0;
    }

    .arena-update.erro::before     { background: #EB5757; }
    .arena-update.carregando::before { background: #F2994A; }

    /* Ocultar timestamp no Telão — público não precisa de metadado técnico */
    body.modo-telao .arena-update,
    :fullscreen .arena-update,
    :-webkit-full-screen .arena-update { display: none !important; }

    /* ── Cronômetro ─────────────────────────────────────────────── */
    .cronometro {
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-areas: "round display btns";
      align-items: center;
      gap: 0 1.75rem;
      background: var(--ar-surface);
      border: 1px solid var(--ar-border);
      border-radius: var(--radius);
      padding: 1rem 1.75rem;
      margin-bottom: 1.25rem;
    }

    .crono-round {
      grid-area: round;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ar-muted);
      white-space: nowrap;
    }

    .crono-display {
      grid-area: display;
      text-align: center;
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--ar-gold);
      letter-spacing: .05em;
      font-variant-numeric: tabular-nums;
      min-width: 4.5ch;
      transition: color .3s;
    }

    .crono-display.urgente { color: #F2994A; }
    .crono-display.acabou  { color: #EB5757; animation: pisca .5s infinite alternate; }
    @keyframes pisca { from { opacity:1 } to { opacity:.2 } }

    .crono-btns {
      grid-area: btns;
      display: flex;
      gap: .5rem;
      align-items: center;
      justify-content: flex-end;
    }

    /* Reset — substitui inline style, usando ID local */
    #btn-crono-reset {
      border-color: var(--ar-border);
      color: var(--ar-muted);
    }

    #btn-crono-reset:hover {
      border-color: var(--ar-text);
      color: var(--ar-text);
      background: transparent;
    }

    /* Select de round — substitui inline style */
    #sel-round {
      background: var(--ar-bg2);
      color: var(--ar-text);
      border: 1px solid var(--ar-border);
      border-radius: 8px;
      padding: .4rem .75rem;
      font-family: inherit;
      font-size: .83rem;
      cursor: pointer;
      outline: none;
      transition: border-color .15s;
    }

    #sel-round:hover,
    #sel-round:focus { border-color: var(--azul); }

    /* ── Tabela / Ranking ───────────────────────────────────────── */
    .arena-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
    }

    .arena-table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    .arena-table thead th {
      background: var(--ar-head);
      color: rgba(255,255,255,.8);
      padding: .85rem 1.25rem;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      border-bottom: 2px solid var(--ar-border);
    }

    .arena-table thead th.th-equipe { text-align: left; }

    .arena-table tbody tr {
      border-bottom: 1px solid var(--ar-border);
      transition: background .15s;
    }

    .arena-table tbody tr:nth-child(odd)  { background: var(--ar-bg);  }
    .arena-table tbody tr:nth-child(even) { background: var(--ar-bg2); }
    .arena-table tbody tr:hover           { background: var(--ar-surface); }
    .arena-table tbody tr:last-child      { border-bottom: none; }

    .arena-table td {
      padding: .95rem 1.25rem;
      text-align: center;
      font-size: 1.15rem;
      color: var(--ar-text);
      font-variant-numeric: tabular-nums;
    }

    .arena-table td.td-equipe { text-align: left; }

    .arena-table td.td-equipe strong {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .arena-table td.td-equipe .text-sm {
      color: var(--ar-muted);
      font-size: .78rem;
      font-variant-numeric: normal;
    }

    /* Melhor round: fundo quase imperceptível + cor dourada */
    .arena-table td.td-melhor-round {
      background: rgba(242,201,76,.04);
      color: var(--ar-gold);
      font-weight: 700;
    }
    body.claro .arena-table td.td-melhor-round {
      background: rgba(183,121,31,.06);
    }

    /* Coluna Melhor */
    .arena-table td.td-melhor {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--ar-gold);
    }

    .arena-table td.td-vazio { color: var(--ar-muted); }

    /* ── Estado sem dados ───────────────────────────────────────── */
    .arena-vazio {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--ar-muted);
      font-size: 1.1rem;
    }

    /* ── Modo grande ────────────────────────────────────────────── */
    body.grande .arena-table thead th       { font-size: 1rem;   padding: 1rem 1.5rem; }
    body.grande .arena-table td             { font-size: 1.35rem; padding: 1rem 1.5rem; }
    body.grande .arena-table td.td-equipe strong { font-size: 1.4rem; }
    body.grande .arena-table td.td-melhor   { font-size: 1.6rem; }
    body.grande .crono-display              { font-size: 5rem; }

    /* ── Modo Telão — fullscreen ────────────────────────────────── */

    /* Ocultar administrativo: class JS + :fullscreen nativo (dupla garantia) */
    body.modo-telao .topbar,
    :fullscreen .topbar,
    :-webkit-full-screen .topbar          { display: none !important; }

    body.modo-telao .arena-controles,
    :fullscreen .arena-controles,
    :-webkit-full-screen .arena-controles { display: none !important; }

    body.modo-telao .crono-btns,
    :fullscreen .crono-btns,
    :-webkit-full-screen .crono-btns      { display: none !important; }

    /* Container: largura total, mínimo de margem */
    body.modo-telao .container {
      max-width: none;
      width: 100%;
      padding: clamp(20px, 2.5vh, 40px) clamp(32px, 4vw, 80px);
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      grid-template-areas:
        "header crono"
        "table  table";
      align-content: start;
      align-items: center;
      gap: clamp(.75rem, 1.5vh, 1.5rem) 2.5rem;
    }

    body.modo-telao .arena-header {
      grid-area: header;
      margin: 0;
      align-self: center;
    }

    /* Cronômetro: compacto, coluna à direita */
    body.modo-telao .cronometro {
      grid-area: crono;
      align-self: center;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .05rem;
    }

    body.modo-telao .arena-wrap { grid-area: table; }

    /* Tipografia do Telão */
    body.modo-telao .arena-titulo {
      font-size: clamp(1.4rem, 2.2vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -.3px;
    }

    body.modo-telao .crono-round {
      font-size: clamp(.7rem, 1vw, .95rem);
      letter-spacing: .14em;
      text-align: right;
    }

    body.modo-telao .crono-display {
      font-size: clamp(4.5rem, 6vw, 7rem);
      line-height: .95;
      text-align: right;
      min-width: unset;
    }

    /* Tabela no Telão — protagonista da tela */
    body.modo-telao .arena-table thead th {
      font-size: clamp(1rem, 1.25vw, 1.4rem);
      padding: 1rem 1.5rem;
    }

    body.modo-telao .arena-table td {
      font-size: clamp(1.25rem, 1.6vw, 1.8rem);
      padding: clamp(14px, 1.5vh, 22px) 1.5rem;
    }

    body.modo-telao .arena-table td.td-equipe strong {
      font-size: clamp(1.35rem, 1.7vw, 2rem);
    }

    body.modo-telao .arena-table td.td-equipe .text-sm {
      font-size: clamp(.72rem, .85vw, .9rem);
    }

    body.modo-telao .arena-table td.td-melhor {
      font-size: clamp(1.5rem, 2vw, 2.2rem);
    }

    /* body.grande não deve duplicar escala no telão:
       como body.modo-telao vem depois no cascade e tem
       mesma especificidade, sobrepõe body.grande. */

    /* ── Responsividade local ───────────────────────────────────── */
    @media (max-width: 860px) {
      .cronometro {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
        grid-template-areas:
          "round display"
          "btns  btns";
        gap: .75rem 1rem;
        padding: .875rem 1.25rem;
      }
      .crono-display { text-align: right; }
    }

    @media (max-width: 580px) {
      .cronometro {
        grid-template-columns: 1fr;
        grid-template-areas:
          "display"
          "round"
          "btns";
      }
      .crono-display { text-align: center; font-size: 2.8rem; }
      .crono-round   { text-align: center; }
      .crono-btns    { justify-content: center; flex-wrap: wrap; }
      .arena-controles { margin-left: 0; }
      .arena-titulo  { font-size: 1.35rem; }
    }
  </style>
</head>

<main class="app-main">

  <div class="arena-header">

      <button class="btn btn-outline btn-sm" id="btn-tamanho" onclick="alternarTamanho()">Grande</button>

<div id="toast"></div>
<script src="js/api.js"></script>
<script>
  function alternarTema() {
    const claro = document.body.classList.toggle('claro');
    document.getElementById('btn-tema').textContent = claro ? 'Escuro' : 'Claro';
  }

  function alternarTamanho() {
    const grande = document.body.classList.toggle('grande');
    document.getElementById('btn-tamanho').textContent = grande ? 'Normal' : 'Grande';
  }

  function telaCheia() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }

  function aplicarModoTelao(ativo) {
    document.body.classList.toggle('modo-telao', ativo);
    // Manipulação direta garante ocultação independente de especificidade CSS
    var ocultar = ativo ? 'none' : '';
    var topbar    = document.querySelector('.topbar');
    var controles = document.querySelector('.arena-controles');
    var cronoBtns = document.querySelector('.crono-btns');
    if (topbar)    topbar.style.display    = ocultar;
    if (controles) controles.style.display = ocultar;
    if (cronoBtns) cronoBtns.style.display = ocultar;
  }

  document.addEventListener('fullscreenchange', function () {
    aplicarModoTelao(!!(document.fullscreenElement || document.webkitFullscreenElement));
  });
  document.addEventListener('webkitfullscreenchange', function () {
    aplicarModoTelao(!!(document.fullscreenElement || document.webkitFullscreenElement));
  });

  const nomesMap = {
    TUR01:'6° A - Cyber Panter',      TUR02:'6° B - Liga do Choque',
    TUR03:'6° C - Alpha Tech',         TUR04:'6° D - Pheonics Mecanics',
    TUR05:'6° E - TecShark',           TUR06:'7° A - Hoppin Robots',
    TUR07:'7° B - Bivoltx',            TUR08:'7° C - Ecoshift',
    TUR09:'7° D - Pantera Lego Team',  TUR10:'7° E - Império das Onças',
    TUR11:'7° F - Poseidon',           TUR12:'7° G - Arara Azul',
    TUR13:'7° H - Nexos'
  };

  function renderArena(data) {
    const equipes     = data.equipes     || [];
    const roundsOrdem = data.roundsOrdem || [];
    const head = document.getElementById('arena-head');
    const body = document.getElementById('arena-body');

    if (!equipes.length) {
      head.innerHTML = '';
      body.innerHTML = '<tr><td colspan="10" class="arena-vazio">Nenhum resultado de Arena ainda.</td></tr>';
      return;
    }

    head.innerHTML = `<tr>
      <th style="width:52px">Pos.</th>
      <th class="th-equipe">Equipe</th>
      ${roundsOrdem.map(r => `<th>${r}</th>`).join('')}
      <th>Melhor</th>
    </tr>`;

    body.innerHTML = equipes.map(function(e, i) {
      const pos    = i + 1;
      const posCls = pos === 1 ? 'pos-1' : pos === 2 ? 'pos-2' : pos === 3 ? 'pos-3' : 'pos-n';

      const cells = roundsOrdem.map(function(r) {
        const pts = e.rounds[r];
        if (pts === undefined) return '<td class="td-vazio">—</td>';
        const isBest = pts === e.melhor;
        return `<td class="${isBest ? 'td-melhor-round' : ''}">${pts}</td>`;
      }).join('');

      return `<tr>
        <td><span class="pos-badge ${posCls}">${pos}</span></td>
        <td class="td-equipe">
          <strong>${nomesMap[e.id] || e.nome || e.id}</strong><br>
          <span class="text-sm">${e.id}</span>
        </td>
        ${cells}
        <td class="td-melhor">${e.melhor}</td>
      </tr>`;
    }).join('');
  }

  let ultimaSync = null;
  let relTimer   = null;

  function atualizarSync() {
    var el = document.getElementById('arena-update');
    if (!ultimaSync) return;
    el.classList.remove('erro', 'carregando');
    var seg = Math.round((Date.now() - ultimaSync) / 1000);
    if (seg < 5)  el.textContent = 'Sincronizado agora';
    else if (seg < 60) el.textContent = 'há ' + seg + ' s';
    else          el.textContent = 'há ' + Math.round(seg / 60) + ' min';
  }

  async function carregar() {
    var upEl = document.getElementById('arena-update');
    upEl.classList.add('carregando');
    document.getElementById('spinner').style.display = '';
    try {
      const r = await API.arena();
      if (!r.ok) throw new Error(r.erro || 'Erro');
      renderArena(r);
      ultimaSync = Date.now();
      atualizarSync();
      if (!relTimer) relTimer = setInterval(atualizarSync, 5000);
    } catch (e) {
      upEl.classList.remove('carregando');
      upEl.classList.add('erro');
      upEl.textContent = 'Falha na sincronização';
      toast('Erro ao carregar: ' + e.message, 'err');
    } finally {
      document.getElementById('spinner').style.display = 'none';
    }
  }

  iniciarPolling(carregar, 10000);

  // ── Cronômetro ────────────────────────────────────────────────────
  let cronoSeg = 150, cronoRodando = false, cronoTimer = null;
  let roundAtual = 'R1';
  const audioCtx = typeof AudioContext !== 'undefined' ? new AudioContext() : null;

  function beep(freq, dur, vol) {
    if (!audioCtx) return;
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }

  function cronoAtualizar() {
    const el = document.getElementById('crono-display');
    el.textContent = Math.floor(cronoSeg / 60) + ':' + String(cronoSeg % 60).padStart(2, '0');
    el.classList.toggle('urgente', cronoSeg > 0 && cronoSeg <= 30);
    el.classList.toggle('acabou',  cronoSeg === 0);
  }

  function trocarRound(val) {
    roundAtual = val;
    document.getElementById('crono-round').textContent = 'Round ' + val.replace('R', '');
    cronoReset();
  }

  function cronoToggle() {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (cronoSeg === 0) { cronoReset(); return; }
    cronoRodando = !cronoRodando;
    document.getElementById('btn-crono-toggle').textContent = cronoRodando ? '⏸ Pausar' : '▶ Continuar';
    if (cronoRodando) {
      cronoTimer = setInterval(function () {
        if (cronoSeg > 0) cronoSeg--;
        cronoAtualizar();
        if (cronoSeg === 30) beep(880, .12, .4);
        if (cronoSeg === 10) beep(1046, .12, .5);
        if (cronoSeg === 0) {
          clearInterval(cronoTimer);
          cronoRodando = false;
          document.getElementById('btn-crono-toggle').textContent = '↺ Reiniciar';
          beep(523, .08, .6);
          setTimeout(() => beep(523, .08, .6), 150);
          setTimeout(() => beep(784, .35, .7), 300);
        }
      }, 1000);
    } else {
      clearInterval(cronoTimer);
    }
  }

  function cronoReset() {
    if (cronoRodando && !confirm('Resetar o cronômetro em execução?')) return;
    clearInterval(cronoTimer);
    cronoRodando = false;
    cronoSeg = 150;
    cronoAtualizar();
    document.getElementById('btn-crono-toggle').textContent = '▶ Iniciar';
    document.getElementById('crono-round').textContent = 'Round ' + roundAtual.replace('R', '');
  }

  document.getElementById('crono-round').textContent = 'Round 1';
</script>
</body>
